pid /tmp/nginx.pid;
error_log stderr info;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 12m;

  upstream mercivo_api {
    server 127.0.0.1:3000;
    keepalive 8;
  }

  upstream mercivo_storefront {
    server 127.0.0.1:8081;
    keepalive 8;
  }

  # The generated run.app address serves the administration UI.
  server {
    listen 8080;
    server_name ~\.run\.app$ localhost 127.0.0.1;
    root /srv/admin;
    index index.html;

    location = /healthz {
      proxy_pass http://mercivo_api/healthz;
    }

    location /api/ {
      proxy_pass http://mercivo_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # Custom tenant domains are routed to the shared storefront process.
  server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
      proxy_pass http://mercivo_api/healthz;
    }

    location /api/ {
      proxy_pass http://mercivo_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://mercivo_storefront;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
