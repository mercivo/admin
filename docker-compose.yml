name: mercivo

services:
  # ============================================================
  # MySQL 8.0
  # ============================================================
  mercivo-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - '${DB_HOST_PORT}:3306'
    volumes:
      - mercivo_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mercivo-network

  # ============================================================
  # Redis 7
  # ============================================================
  mercivo-redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT}:6379'
    volumes:
      - mercivo_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mercivo-network

  # ============================================================
  # 与 Cloud Build 的 mercivo-migrate Job 对齐：先准备数据库，再启动 API。
  migrate:
    image: mercivo-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      NODE_ENV: production
      DB_HOST: mercivo-mysql
      DB_PORT: 3306
      DB_USERNAME: root
      REDIS_HOST: mercivo-redis
      REDIS_PORT: 6379
    command: ['/app/run-migrations.sh']
    depends_on:
      mercivo-mysql:
        condition: service_healthy
    restart: 'no'
    networks:
      - mercivo-network

  # NestJS API 与发布服务
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: mercivo-api:latest
    restart: unless-stopped
    ports:
      - '${API_PORT}:8080'
    env_file:
      - ${ENV_FILE:-.env.local}
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: mercivo-mysql
      DB_PORT: 3306
      DB_USERNAME: root
      REDIS_HOST: mercivo-redis
      REDIS_PORT: 6379
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-key.json
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mercivo-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - mercivo-network

  # 商家后台，仅供内部员工使用
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_STOREFRONT_PREVIEW_URL: ${STOREFRONT_URL}
    image: mercivo-admin:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      API_INTERNAL_HOST: api
    ports:
      - '${ADMIN_PORT}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mercivo-network

  # 客户公开独立站，通过 Host 头解析站点
  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    image: mercivo-storefront:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      API_INTERNAL_URL: http://api:8080
      STOREFRONT_PATH_HOSTS: site.aihubflux.com,localhost
    ports:
      - '${STOREFRONT_PORT}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mercivo-network

volumes:
  mercivo_mysql_data:
    driver: local
  mercivo_redis_data:
    driver: local

networks:
  mercivo-network:
    driver: bridge
